name: Update the books
on:
  push:
    branches: [main]
    paths:
      - 'decisions/inbox/**'
      - 'scripts/**'
      - 'config/**'
  workflow_dispatch:
  schedule:
    # Times are UTC. Weekday mornings: record stock decisions before the US open.
    - cron: '10 13 * * 1-5'
    # Weekdays after the US close, in both summer and winter time.
    - cron: '25 20 * * 1-5'
    - cron: '25 21 * * 1-5'
    # Daily: record crypto decisions before the UTC day ends, then book the finished day.
    - cron: '50 23 * * *'
    - cron: '12 0 * * *'
    # Daily catch-up in case an earlier run was skipped.
    - cron: '40 3 * * *'
permissions:
  contents: write
concurrency:
  group: ledger
  cancel-in-progress: false
jobs:
  books:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Collect prices and update the books
        run: python scripts/engine.py
      - name: Commit the updated books
        run: |
          git config user.name "mandate-ledger"
          git config user.email "mandate-ledger@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "Update the books"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
